[project]
name = "moderation-backend"
version = "1.0.0"
description = "Multi-language content moderation microservice backend"
requires-python = ">=3.11"
dependencies = [
    # Core frameworks
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "gunicorn==26.0.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "orjson==3.11.9",
    # Level 1 - C/C++/Rust detectors
    "pyahocorasick==2.3.1",
    "python-Levenshtein==0.27.4",
    "pybloom-live==4.0.0",
    "mmh3==5.2.1",
    "regex==2026.7.19",
    "pybktree==1.1",
    "metaphone==0.6",
    # Multi-language detectors (installable from public indexes)
    "badwords-py==2.1.0",
    "profanite==0.1.9",
    "glin-profanity==3.4.0",
    "gangajal==0.1.0",
    "scheckbl==1.1.0",
    "valx==0.2.6",
    "pyprofane==1.0.7",
    "aiohttp==3.12.0",
    # Security & utilities
    "cryptography==50.0.0",
    "slowapi==0.1.10",
    "python-json-logger==4.1.0",
    "atomicwrites==1.4.1",
    "python-multipart==0.0.32",
    # Model auto-download and mirror fallback
    "requests==2.32.3",
    "huggingface-hub==1.27.0",
    "modelscope==1.39.1",
    # Semantic similarity layer (not wired into detection; requires a
    # pre-built toxic-signature database)
    "datasketch==2.0.0",
]

[project.optional-dependencies]
ai = ["llama-cpp-python==0.3.34"]
# Semantic similarity stage (SentenceTransformers + Faiss). Heavy: pulls torch.
# Enable with: uv sync --extra ai --extra semantic
semantic = [
    "torch>=2.2",
    "sentence-transformers>=4.5,<6",
    "faiss-cpu>=1.9,<2",
]

[dependency-groups]
dev = [
    "ruff==0.16.2",
    "pytest==8.4.1",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
]

# Not included because no reachable index (pypi.org, Tsinghua, Aliyun)
# provides an installable release:
#   sensitive-word-filter-cn==0.1.6, profanite==0.1.10, badwords-py==2.3.1,
#   safetext==0.3.3, profanity-filter2==1.4.3
# The MultiLanguageDetector guard-wires these; they activate if a working
# index provides them. Verify with: uv add <package>==<version>

[tool.uv]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
pythonpath = ["."]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore::DeprecationWarning:slowapi.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
